name: Sistema Leads - automacoes recorrentes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sistema-leads-automation-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validar configuracao
        env:
          BASE_URL: ${{ secrets.AUTOMATION_BASE_URL }}
          CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          test -n "$BASE_URL" || { echo "Secret AUTOMATION_BASE_URL ausente"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Secret OUTREACH_CRON_SECRET ausente"; exit 1; }

      - name: Executar follow-ups da Ana
        env:
          BASE_URL: ${{ secrets.AUTOMATION_BASE_URL }}
          CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST "${BASE_URL%/}/api/public/outreach-tick" \
            -H "Authorization: Bearer $CRON_SECRET"

      - name: Executar campanhas de prospeccao
        env:
          BASE_URL: ${{ secrets.AUTOMATION_BASE_URL }}
          CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST "${BASE_URL%/}/api/public/prospecting-tick" \
            -H "Authorization: Bearer $CRON_SECRET"
